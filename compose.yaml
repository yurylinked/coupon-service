name: coupon-service

services:
  postgres:
    image: public.ecr.aws/docker/library/postgres:18-alpine
    environment:
      POSTGRES_DB: coupons
      POSTGRES_USER: coupons
      POSTGRES_PASSWORD: coupons
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coupons -d coupons"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    image: coupon-service:local
    deploy:
      replicas: 2
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/coupons
      SPRING_DATASOURCE_USERNAME: coupons
      SPRING_DATASOURCE_PASSWORD: coupons
      TRUSTED_PROXIES: 172\.30\.0\.10
      COUPONS_GEO_PROVIDER: static
      COUPONS_GEO_STATIC_COUNTRY: ${DEMO_COUNTRY:-PL}
    depends_on:
      postgres:
        condition: service_healthy

  proxy:
    image: public.ecr.aws/docker/library/nginx:1.29-alpine
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:8080"
    networks:
      default:
        ipv4_address: 172.30.0.10
    depends_on:
      app:
        condition: service_healthy

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24
