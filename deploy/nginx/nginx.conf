events {}

http {
    # Docker's DNS, re-read every 5 s so recreated replicas get traffic without reloading nginx.
    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream coupon_service {
        zone coupon_service 64k;
        server app:8080 resolve;
    }

    server_tokens off;
    absolute_redirect off;
    client_max_body_size 16k;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Forwarded-Port "";

    # Public edge: customers can only redeem. Errors nginx produces itself are problem+json like the service's own.
    server {
        listen 8080;

        location = /api/v1/redemptions {
            limit_except POST {
                deny all;
            }
            # The URI is spelled out so the service receives the normalised path, not the client's raw one.
            proxy_pass http://coupon_service/api/v1/redemptions;
            # Demo instrumentation for prove.sh: shows which replica answered. Not for production.
            add_header X-Served-By $upstream_addr always;
        }

        location / {
            return 403;
        }

        error_page 400 408 414 494 = @bad_request;
        error_page 403 404 405 = @rejected;
        error_page 413 = @too_large;
        error_page 502 503 504 = @unavailable;

        location @bad_request {
            default_type application/problem+json;
            return 400 '{"title":"Bad Request","status":400,"detail":"The request could not be read","errorCode":"MALFORMED_REQUEST"}';
        }

        location @rejected {
            default_type application/problem+json;
            return 403 '{"title":"Forbidden","status":403,"detail":"Not available on the public edge","errorCode":"REQUEST_REJECTED"}';
        }

        location @too_large {
            default_type application/problem+json;
            return 413 '{"title":"Payload Too Large","status":413,"detail":"Request body is too large","errorCode":"REQUEST_REJECTED"}';
        }

        location @unavailable {
            default_type application/problem+json;
            add_header Retry-After 2 always;
            return 503 '{"title":"Service Unavailable","status":503,"detail":"Service temporarily unavailable, retry the request","errorCode":"SERVICE_UNAVAILABLE"}';
        }
    }

    # Internal edge for back office and the order system (create, read, suspend, cancel). Published on localhost only.
    server {
        listen 8082;

        location /api/ {
            proxy_pass http://coupon_service;
        }

        location / {
            return 404;
        }

        error_page 400 408 414 494 = @bad_request;
        error_page 404 = @not_found;
        error_page 405 = @method_not_allowed;
        error_page 413 = @too_large;
        error_page 502 503 504 = @unavailable;

        location @bad_request {
            default_type application/problem+json;
            return 400 '{"title":"Bad Request","status":400,"detail":"The request could not be read","errorCode":"MALFORMED_REQUEST"}';
        }

        location @not_found {
            default_type application/problem+json;
            return 404 '{"title":"Not Found","status":404,"detail":"No endpoint at this path","errorCode":"NOT_FOUND"}';
        }

        location @method_not_allowed {
            default_type application/problem+json;
            return 405 '{"title":"Method Not Allowed","status":405,"detail":"Method not supported","errorCode":"METHOD_NOT_ALLOWED"}';
        }

        location @too_large {
            default_type application/problem+json;
            return 413 '{"title":"Payload Too Large","status":413,"detail":"Request body is too large","errorCode":"REQUEST_REJECTED"}';
        }

        location @unavailable {
            default_type application/problem+json;
            add_header Retry-After 2 always;
            return 503 '{"title":"Service Unavailable","status":503,"detail":"Service temporarily unavailable, retry the request","errorCode":"SERVICE_UNAVAILABLE"}';
        }
    }
}
