events {}

http {
    upstream coupon_service {
        server app:8080;
    }

    server {
        listen 8080;

        location /api/ {
            proxy_pass http://coupon_service;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            add_header X-Served-By $upstream_addr always;
        }
    }
}
