spring:
  application:
    name: coupon-service
  threads:
    virtual:
      enabled: true
  datasource:
    hikari:
      maximum-pool-size: 10
      connection-timeout: 2000

server:
  forward-headers-strategy: native
  tomcat:
    remoteip:
      internal-proxies: '${TRUSTED_PROXIES:127.0.0.0/8, ::1/128}'

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

coupons:
  redemption:
    lock-timeout: 2s
    bulkhead:
      permits-per-stripe: 4
      stripes: 1024
      max-wait: 200ms
  geo:
    provider: dbip
    dbip:
      database: geo/dbip-country-lite.mmdb
