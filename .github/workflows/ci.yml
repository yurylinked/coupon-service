name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: unit and integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: pull the Testcontainers PostgreSQL image
        run: |
          for attempt in 1 2 3; do
            docker pull public.ecr.aws/docker/library/postgres:18-alpine && exit 0
            echo "image pull failed (attempt $attempt), registry rate limits are the usual cause, retrying"
            sleep $((attempt * 20))
          done
          exit 1
      - run: ./gradlew check --console=plain
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: build/reports/tests

  e2e:
    name: two replicas behind nginx, 200 redemptions 50 at a time
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: build and pull images, retrying registry rate limits
        run: |
          for attempt in 1 2 3; do
            docker compose build --pull && docker compose pull postgres proxy && exit 0
            echo "build or pull failed (attempt $attempt), retrying"
            sleep $((attempt * 20))
          done
          exit 1
      - name: start postgres, two app replicas and nginx
        run: docker compose up --detach --wait --wait-timeout 300
      - run: ./scripts/prove.sh
      - if: failure() || cancelled()
        run: docker compose logs > compose.log; cat compose.log
      - if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compose-logs
          path: compose.log
      - if: always()
        run: docker compose down --volumes
