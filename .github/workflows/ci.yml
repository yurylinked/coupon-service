name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: unit and integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: pull the Testcontainers PostgreSQL image
        run: |
          for attempt in 1 2 3; do
            docker pull public.ecr.aws/docker/library/postgres:18-alpine && exit 0
            echo "image pull failed (attempt $attempt), registry rate limits are the usual cause, retrying"
            sleep $((attempt * 20))
          done
          exit 1
      - run: ./gradlew check --console=plain
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: build/reports/tests

  e2e:
    name: two replicas behind nginx, 200 parallel redemptions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: start postgres, two app replicas and nginx
        run: |
          for attempt in 1 2 3; do
            docker compose up --build --detach --wait --wait-timeout 300 && exit 0
            echo "compose up failed (attempt $attempt), registry rate limits are the usual cause, retrying"
            sleep $((attempt * 20))
          done
          exit 1
      - run: ./scripts/prove.sh
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down --volumes

  benchmark:
    name: pool starvation without the bulkhead (measurement)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: github.event_name != 'pull_request'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew benchmarkTest --console=plain
